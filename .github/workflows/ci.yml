# CI Workflow for trace-spine
# Runs on pull requests and pushes to main
#
# Jobs:
# - check: bb check = clj-kondo + cljfmt + tests in lib/clj and every
#   platform service (aygp-dr clojure standard v1). It replaces the old
#   clj-kondo step and the per-service test matrix.
# - org-lint: org-mode docs
# - c4-check: Validate C4 architecture diagrams
# - build: service uberjars (main only)

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# least privilege for GITHUB_TOKEN (L7 C1)
permissions:
  contents: read

jobs:
  check:
    name: bb check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@6d46099eae24853c33c0482f2bb54edf4f1a4c74 # 13.7.0
        with:
          cli: latest
          bb: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-${{ hashFiles('**/deps.edn', '**/bb.edn') }}
          restore-keys: clj-${{ runner.os }}-
      - run: bb check

  org-lint:
    name: org-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Org files
        run: make org-lint

  c4-check:
    name: C4 Diagrams
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js (for mermaid-cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mermaid-cli
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Validate C4 diagrams
        run: make c4-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [check, org-lint]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - api
          - wms
          - payments
          - wallet
          - fraud
          - metrics
          - feature-flags
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: latest

      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure/.cpcache
          key: ${{ runner.os }}-clojure-${{ matrix.service }}-${{ hashFiles(format('platform/{0}/deps.edn', matrix.service)) }}
          restore-keys: |
            ${{ runner.os }}-clojure-${{ matrix.service }}-
            ${{ runner.os }}-clojure-

      - name: Build ${{ matrix.service }}
        run: make -C platform/${{ matrix.service }} build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: platform/${{ matrix.service }}/target/*.jar
          retention-days: 7

  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [check, org-lint, c4-check]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "bb check failed"
            exit 1
          fi
          if [[ "${{ needs.org-lint.result }}" != "success" ]]; then
            echo "Org lint failed"
            exit 1
          fi
          if [[ "${{ needs.c4-check.result }}" != "success" ]]; then
            echo "C4 check failed"
            exit 1
          fi
          echo "All checks passed!"
