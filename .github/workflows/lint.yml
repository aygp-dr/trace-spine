# Dedicated Linting Workflow for trace-spine
# Runs linting checks independently for faster feedback
#
# This workflow runs on all pushes and PRs to provide quick feedback
# on code quality without waiting for the full test suite.

name: Lint

on:
  push:
    branches: [main]
    paths:
      - "**.clj"
      - "**.cljc"
      - "**.cljs"
      - "**.edn"
      - "**.org"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.clj"
      - "**.cljc"
      - "**.cljs"
      - "**.edn"
      - "**.org"
      - ".github/workflows/lint.yml"

# least privilege for GITHUB_TOKEN (L7 C1)
permissions:
  contents: read

jobs:
  # clj-kondo runs in ci.yml as part of bb check (lib/clj and every
  # service, src/test/dev, failing on errors only).

  org-lint:
    name: org-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate org-mode files
        run: |
          chmod +x bin/org-lint
          bin/org-lint

  deps-edn:
    name: deps.edn validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: "1.12.0"

      - name: Validate deps.edn syntax
        run: |
          for f in $(find . -name "deps.edn" -type f); do
            echo "Validating $f"
            clojure -Sdeps "{:deps {}}" -e "(read-string (slurp \"$f\"))" || exit 1
          done
          echo "All deps.edn files are valid"

  emacs-org-lint:
    name: Emacs org-lint (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y emacs-nox

      - name: Run Emacs org-lint
        run: |
          # Run org-lint on all org files
          # This provides more comprehensive checking than the shell script
          find . -name "*.org" -type f ! -path "./.git/*" | while read -r file; do
            echo "Checking: $file"
            emacs --batch \
              --eval "(require 'org)" \
              --eval "(require 'org-lint)" \
              --visit "$file" \
              --eval "(let ((warnings (org-lint))) \
                       (when warnings \
                         (dolist (w warnings) \
                           (message \"Line %d: %s\" (car w) (nth 2 w)))))" \
              2>&1 || true
          done
